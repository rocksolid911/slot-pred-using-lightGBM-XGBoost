[project]
name = "slotpred"
version = "0.1.0"
description = "Predict OPD consult slot length (P50 / P80) - a learning project"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slotpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
